name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ADOBE_FONTS_PROJECT_ID: ${{ vars.ADOBE_FONTS_PROJECT_ID }}
      SITE_ENV: ${{ vars.SITE_ENV || 'preview' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - name: Install dependencies
        run: npm ci
      - name: Verify preview and production builds
        run: npm run check
      - name: Build for the configured Pages domain
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          if [ "$SITE_ENV" = production ]; then
            test "${PAGES_BASE_URL%/}" = https://katecourtright.com
            npm run build:production
          elif [ "$SITE_ENV" = preview ]; then
            test "${PAGES_BASE_URL%/}" = https://ndunn219.github.io/katecourtright
            npm run build:preview
          else
            echo 'SITE_ENV must be preview or production.' >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: _artifact
      - name: Extract the deployed build for verification
        run: mkdir -p _site && tar -xf _artifact/artifact.tar -C _site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify hosted pages, assets, downloads, and 404s
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3; do
            if python3 scripts/check_hosted.py --base-url "$DEPLOYED_URL" --report hosted-check.json; then
              exit 0
            fi
            if [ "$attempt" != 3 ]; then sleep 15; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-verification
          path: hosted-check.json
          if-no-files-found: ignore
